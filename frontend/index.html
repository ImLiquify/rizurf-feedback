<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://web-omega-two-47.vercel.app/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Rizurf Feedback</title>
    <!-- Theme before first paint (no light flash): saved choice, else the OS setting. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- SS-28: back-to-gateway button, served by the gateway (MICROAPP_GATEWAY_BUTTON.md) -->
    <script src="https://web-omega-two-47.vercel.app/widget/gateway-button.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
